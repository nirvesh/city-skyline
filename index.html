<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>City Skyline</title>
    <meta name="description" content="An animated city skyline built with pure HTML and CSS, cycling from day to night." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="City Skyline" />
    <meta property="og:description" content="An animated city skyline built with pure HTML and CSS, cycling from day to night." />
    <meta property="og:image" content="https://nirvesh.github.io/city-skyline/city-skyline.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="City Skyline" />
    <meta name="twitter:description" content="An animated city skyline built with pure HTML and CSS, cycling from day to night." />
    <meta name="twitter:image" content="https://nirvesh.github.io/city-skyline/city-skyline.png" />

    <link href="css/styles.css?v=9" rel="stylesheet" />
    <script>
      (function () {
        var urlScene = new URLSearchParams(location.search).get('scene');
        var root = document.documentElement;

        function apply(scene) {
          root.classList.remove('show-day', 'show-night');
          root.classList.add(scene === 'night' ? 'show-night' : 'show-day');
        }

        if (urlScene === 'day' || urlScene === 'night') {
          apply(urlScene);
          return;
        }

        var scene = 'day';
        apply(scene);
        setInterval(function () {
          scene = (scene === 'day') ? 'night' : 'day';
          apply(scene);
        }, 5000);
      })();
    </script>
  </head>

  <body>
    <div class="scene-stack">
      <!-- DAY COPY -->
      <div class="scene scene-day">
        <div class="background-buildings sky">
          <div></div><div></div>
          <div class="bb1 building-wrap">
            <div class="bb1a bb1-window"></div>
            <div class="bb1b bb1-window"></div>
            <div class="bb1c bb1-window"></div>
            <div class="bb1d"></div>
          </div>
          <div class="bb2"><div class="bb2a"></div><div class="bb2b"></div></div>
          <div class="bb3"></div>
          <div></div>
          <div class="bb4 building-wrap">
            <div class="bb4a"></div><div class="bb4b"></div>
            <div class="bb4c window-wrap">
              <div class="bb4-window"></div><div class="bb4-window"></div>
              <div class="bb4-window"></div><div class="bb4-window"></div>
            </div>
          </div>
          <div></div><div></div>
        </div>
        <div class="foreground-buildings">
          <div></div><div></div>
          <div class="fb1 building-wrap">
            <div class="fb1a"></div><div class="fb1b"></div><div class="fb1c"></div>
          </div>
          <div class="fb2">
            <div class="fb2a"></div>
            <div class="fb2b window-wrap">
              <div class="fb2-window"></div><div class="fb2-window"></div><div class="fb2-window"></div>
            </div>
          </div>
          <div></div>
          <div class="fb3 building-wrap">
            <div class="fb3a window-wrap">
              <div class="fb3-window"></div><div class="fb3-window"></div><div class="fb3-window"></div>
            </div>
            <div class="fb3b"></div><div class="fb3a"></div><div class="fb3b"></div>
          </div>
          <div class="fb4">
            <div class="fb4a"></div>
            <div class="fb4b">
              <div class="fb4-window"></div><div class="fb4-window"></div><div class="fb4-window"></div>
              <div class="fb4-window"></div><div class="fb4-window"></div><div class="fb4-window"></div>
            </div>
          </div>
          <div class="fb5"></div><div class="fb6"></div>
          <div></div><div></div>
        </div>
      </div>

      <!-- NIGHT COPY -->
      <div class="scene scene-night">
        <div class="background-buildings sky">
          <div></div><div></div>
          <div class="bb1 building-wrap">
            <div class="bb1a bb1-window"></div>
            <div class="bb1b bb1-window"></div>
            <div class="bb1c bb1-window"></div>
            <div class="bb1d"></div>
          </div>
          <div class="bb2"><div class="bb2a"></div><div class="bb2b"></div></div>
          <div class="bb3"></div>
          <div></div>
          <div class="bb4 building-wrap">
            <div class="bb4a"></div><div class="bb4b"></div>
            <div class="bb4c window-wrap">
              <div class="bb4-window"></div><div class="bb4-window"></div>
              <div class="bb4-window"></div><div class="bb4-window"></div>
            </div>
          </div>
          <div></div><div></div>
        </div>
        <div class="foreground-buildings">
          <div></div><div></div>
          <div class="fb1 building-wrap">
            <div class="fb1a"></div><div class="fb1b"></div><div class="fb1c"></div>
          </div>
          <div class="fb2">
            <div class="fb2a"></div>
            <div class="fb2b window-wrap">
              <div class="fb2-window"></div><div class="fb2-window"></div><div class="fb2-window"></div>
            </div>
          </div>
          <div></div>
          <div class="fb3 building-wrap">
            <div class="fb3a window-wrap">
              <div class="fb3-window"></div><div class="fb3-window"></div><div class="fb3-window"></div>
            </div>
            <div class="fb3b"></div><div class="fb3a"></div><div class="fb3b"></div>
          </div>
          <div class="fb4">
            <div class="fb4a"></div>
            <div class="fb4b">
              <div class="fb4-window"></div><div class="fb4-window"></div><div class="fb4-window"></div>
              <div class="fb4-window"></div><div class="fb4-window"></div><div class="fb4-window"></div>
            </div>
          </div>
          <div class="fb5"></div><div class="fb6"></div>
          <div></div><div></div>
        </div>
      </div>
    </div>
  </body>
</html>
